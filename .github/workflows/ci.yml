name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build universal app
        run: macos/build.sh
      - name: Tests (Python reference + Swift parity)
        run: python -m unittest discover -s tests -v
